name: Update and Publish beIN EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bein-epg-update
  cancel-in-progress: false

jobs:
  build:
    name: Extract and prepare EPG files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Python syntax
        run: python -m py_compile epg.py

      - name: Run EPG scraper
        run: python epg.py

      - name: Validate generated XML files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [
              Path("epg_sports.xml"),
              Path("epg_entertainment.xml"),
          ]

          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty file: {path}")

              root = ET.parse(path).getroot()

              if root.tag != "tv":
                  raise SystemExit(f"Invalid XMLTV root: {path}")

              channels = root.findall("channel")
              programmes = root.findall("programme")

              if not channels or not programmes:
                  raise SystemExit(
                      f"No channels or programmes in {path}"
                  )

              channel_ids = {
                  channel.get("id")
                  for channel in channels
              }

              missing_ids = sorted({
                  programme.get("channel")
                  for programme in programmes
                  if programme.get("channel") not in channel_ids
              })

              if missing_ids:
                  raise SystemExit(
                      f"Undefined channel IDs in {path}: {missing_ids}"
                  )

              print(
                  f"OK: {path}: "
                  f"{len(channels)} channels, "
                  f"{len(programmes)} programmes"
              )
          PY

      - name: Move XML files into xml folder
        run: |
          mkdir -p xml
          mv -f epg_sports.xml xml/epg_sports.xml
          mv -f epg_entertainment.xml xml/epg_entertainment.xml

      - name: Commit XML files to main
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          git add xml/epg_sports.xml xml/epg_entertainment.xml

          if git diff --cached --quiet; then
            echo "XML files unchanged; no commit needed."
          else
            git commit -m "Update EPG files"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages website
        run: |
          rm -rf _site
          mkdir -p _site/xml

          cp xml/epg_sports.xml _site/xml/epg_sports.xml
          cp xml/epg_entertainment.xml _site/xml/epg_entertainment.xml

          touch _site/.nojekyll

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>beIN EPG</title>
          </head>
          <body>
            <h1>beIN EPG</h1>
            <ul>
              <li><a href="xml/epg_sports.xml">Sports EPG</a></li>
              <li><a href="xml/epg_entertainment.xml">Entertainment EPG</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
